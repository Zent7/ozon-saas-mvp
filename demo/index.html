<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedCenters Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand__badge">M</div>
          <div>
            <div class="brand__title">MedCenters</div>
            <div class="brand__subtitle">Демо новой системы</div>
          </div>
        </div>

        <nav class="nav" id="nav"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <div class="eyebrow">Единая система для двух медцентров</div>
            <h1 id="page-title">Главная</h1>
          </div>
        </header>

        <section class="content" id="content"></section>
      </main>
    </div>

    <div class="toast hidden" id="toast"></div>

    <div class="modal hidden" id="loginModal">
      <div class="modal__backdrop"></div>
      <div class="modal__card">
        <div class="modal__header">
          <h2>Вход в систему</h2>
          <button class="icon-button" id="closeLogin">×</button>
        </div>
        <div class="login-card">
          <label class="field">
            <span>Логин</span>
            <input value="admin" readonly />
          </label>
          <label class="field">
            <span>Пароль</span>
            <input value="admin123" readonly />
          </label>
          <button class="primary-button">Войти</button>
        </div>
      </div>
    </div>

    <div class="modal hidden" id="actionModal">
      <div class="modal__backdrop"></div>
      <div class="modal__card">
        <div class="modal__header">
          <h2 id="actionModalTitle">Действие</h2>
          <button class="icon-button" id="closeAction">×</button>
        </div>
        <div class="login-card" id="actionModalContent"></div>
      </div>
    </div>

    <script src="./legacy-data.js"></script>
    <script src="./services-data.js"></script>
    <script src="./doctor-templates.js"></script>
    <script src="./app.js"></script>
    <script src="./services-page.js"></script>
    <script src="./client-modal.js"></script>
    <script src="./doctor-exam-modal.js"></script>
  </body>
</html>
