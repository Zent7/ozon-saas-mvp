services:
  db:
    image: postgres:16
    container_name: medcenters_db
    environment:
      POSTGRES_DB: medcenters
      POSTGRES_USER: medcenters
      POSTGRES_PASSWORD: medcenters
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
