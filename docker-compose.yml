services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ozon_saas
      POSTGRES_USER: ozon
      POSTGRES_PASSWORD: ozon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://ozon:ozon@db:5432/ozon_saas
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata: